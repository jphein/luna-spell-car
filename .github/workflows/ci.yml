name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright
        run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - run: make test
      - run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: luna-spell-car-apk
          path: build/luna-spell-car.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: build/test-shots/
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/luna-spell-car.apk
