name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the tag-only release job below asks for write.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright
        run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Wrangler (Worker tests)
        run: cd worker && npm ci
      - run: make test
      - run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: luna-spell-car-apk
          path: build/luna-spell-car.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: build/test-shots/

  # Only v* tag builds may write: this job creates the GitHub release and attaches the APK the build job uploaded.
  # (Kept out of test-and-build so PR and main builds never run with a write-capable token.)
  release:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luna-spell-car-apk
          path: build
      - name: Attach APK to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2 (pinned: the only third-party action holding a write token)
        with:
          files: build/luna-spell-car.apk
